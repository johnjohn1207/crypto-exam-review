    <!-- 資料腳本與核心邏輯 -->
    <script src="js/exam_data.js"></script>
    <script>
        // 全域狀態
        let currentSection = 'all';    // 'all' | 'formulas' | 'hw1' | 'practice1' | 'variations'
        let currentCategory = 'all';   // 'all' | 'ch1-2' | 'ch4-5' | 'ch6-7' | 'ch8-9'
        let currentViewMode = 'dual';  // 'dual' | 'intuition' | 'proof' | 'exam'
        let currentSearchQuery = '';

        // 收集所有項目
        function getAllItems() {
            let items = [];
            
            // 1. 公式
            EXAM_FORMULAS.forEach(f => {
                items.push({
                    type: 'formula',
                    section: 'formulas',
                    id: f.id,
                    title: `【核心定理】${f.name}`,
                    chapter: f.chapter,
                    category: f.category,
                    badge: '公式定理',
                    badgeColor: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30',
                    math: f.math,
                    question: null,
                    intuition: f.intuition,
                    proof: f.formal,
                    pitfall: f.pitfall
                });
            });

            // 2. 作業一
            HW1_DATA.forEach(h => {
                items.push({
                    type: 'hw1',
                    section: 'hw1',
                    id: h.id,
                    title: h.title,
                    chapter: h.chapter,
                    category: h.category,
                    badge: '作業一',
                    badgeColor: 'bg-blue-500/10 text-blue-400 border-blue-500/30',
                    math: null,
                    question: h.question,
                    intuition: h.intuition,
                    proof: h.proof,
                    pitfall: h.pitfall
                });
            });

            // 3. 練習一
            PRACTICE1_DATA.forEach(p => {
                items.push({
                    type: 'practice1',
                    section: 'practice1',
                    id: p.id,
                    title: p.title,
                    chapter: p.chapter,
                    category: p.category,
                    badge: `練習一・${p.part}`,
                    badgeColor: 'bg-indigo-500/10 text-indigo-400 border-indigo-500/30',
                    math: null,
                    question: p.question + (p.answer ? `\n\n【正確答案】：${p.answer}` : ''),
                    intuition: p.intuition,
                    proof: p.proof,
                    pitfall: p.pitfall
                });
            });

            // 4. 變化題
            VARIATION_DATA.forEach(v => {
                items.push({
                    type: 'variation',
                    section: 'variations',
                    id: v.id,
                    title: v.title,
                    chapter: v.chapter,
                    category: v.category,
                    badge: '變化題型',
                    badgeColor: 'bg-purple-500/10 text-purple-400 border-purple-500/30',
                    math: null,
                    question: v.question,
                    intuition: v.intuition,
                    proof: v.solution,
                    pitfall: v.pitfall
                });
            });

            return items;
        }

        const ALL_ITEMS = getAllItems();

        // 頁面初次載入
        document.addEventListener('DOMContentLoaded', () => {
            renderCards();
        });

        // 切換 Section
        function setSection(sec) {
            currentSection = sec;
            document.querySelectorAll('.sec-btn').forEach(btn => {
                btn.className = 'sec-btn px-3 py-1.5 rounded-lg font-medium transition text-slate-400 hover:text-white';
            });
            const activeBtn = document.getElementById(`sec-${sec}`);
            if (activeBtn) {
                activeBtn.className = 'sec-btn px-3 py-1.5 rounded-lg font-medium transition bg-indigo-600 text-white shadow-sm';
            }
            renderCards();
        }

        // 切換 Category
        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = 'cat-btn px-2.5 py-1 rounded-lg border border-slate-800 hover:border-slate-700 text-slate-400 hover:text-slate-200 transition';
            });
            const activeBtn = document.getElementById(`cat-${cat}`);
            if (activeBtn) {
                activeBtn.className = 'cat-btn px-2.5 py-1 rounded-lg border border-slate-700 bg-slate-800 text-indigo-300 font-medium transition';
            }
            renderCards();
        }

        // 切換 View Mode
        function setViewMode(mode) {
            currentViewMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.className = 'mode-btn px-2.5 py-1 rounded-lg font-medium transition text-slate-400 hover:text-white';
            });
            const activeBtn = document.getElementById(`mode-${mode}`);
            if (activeBtn) {
                activeBtn.className = 'mode-btn px-2.5 py-1 rounded-lg font-medium transition bg-slate-800 text-indigo-300 border border-indigo-500/40 shadow-sm';
            }
            renderCards();
        }

        // 搜尋
        function handleSearch() {
            currentSearchQuery = document.getElementById('search-input').value.trim().toLowerCase();
            renderCards();
        }

        // 核心渲染
        function renderCards() {
            const container = document.getElementById('cards-container');
            
            // 過濾
            const filtered = ALL_ITEMS.filter(item => {
                // Section 過濾
                if (currentSection !== 'all' && item.section !== currentSection) return false;
                // Category 過濾
                if (currentCategory !== 'all' && item.category !== currentCategory) return false;
                // Search 過濾
                if (currentSearchQuery) {
                    const text = `${item.title} ${item.question || ''} ${item.intuition} ${item.proof} ${item.pitfall}`.toLowerCase();
                    if (!text.includes(currentSearchQuery)) return false;
                }
                return true;
            });

            // 更新計數
            document.getElementById('result-count').innerText = `共 ${filtered.length} 筆`;
            document.getElementById('filter-summary').innerText = `目前篩選：${getSectionName(currentSection)} / ${getCategoryName(currentCategory)}`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center text-slate-500">
                        <div class="text-3xl mb-2 font-mono">∅</div>
                        <div class="text-sm">查無符合條件的考點或題目，請嘗試切換主題或清除搜尋關鍵字。</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(item => createCardHTML(item)).join('');

            // 觸發 KaTeX 渲染
            if (window.renderMathInElement) {
                renderMathInElement(container, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        function createCardHTML(item) {
            const isExamMask = (currentViewMode === 'exam');
            const showIntuition = (currentViewMode === 'dual' || currentViewMode === 'intuition' || !isExamMask);
            const showProof = (currentViewMode === 'dual' || currentViewMode === 'proof' || !isExamMask);

            return `
                <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-5 shadow-sm hover:border-slate-700 transition flex flex-col gap-4">
                    
                    <!-- 卡片標頭 -->
                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800/60 pb-3">
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] font-mono font-medium px-2 py-0.5 rounded-full border ${item.badgeColor}">
                                ${item.badge}
                            </span>
                            <span class="text-[11px] font-mono text-slate-400">
                                ${item.chapter}
                            </span>
                            <h2 class="text-sm sm:text-base font-bold text-white tracking-tight">
                                ${item.title}
                            </h2>
                        </div>
                        <button onclick="toggleCardDetail('${item.id}')" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium px-2 py-1 rounded bg-slate-950 border border-slate-800 hover:border-slate-700 transition">
                            展開/折疊
                        </button>
                    </div>

                    <!-- 題目描述或核心公式 -->
                    ${item.math ? `
                        <div class="bg-slate-950/80 border border-slate-800 rounded-xl p-3 text-center latex-rendered font-mono text-indigo-200">
                            $$${item.math}$$
                        </div>
                    ` : ''}

                    ${item.question ? `
                        <div class="text-xs sm:text-sm text-slate-200 leading-relaxed bg-slate-950/40 p-3 rounded-xl border border-slate-800/40 whitespace-pre-line font-sans">
                            ${escapeHTML(item.question)}
                        </div>
                    ` : ''}

                    <!-- 內容展開容器 -->
                    <div id="detail-${item.id}" class="${isExamMask ? 'hidden' : 'flex'} flex-col gap-4 transition">
                        
                        <!-- 雙軌對照區塊 -->
                        <div class="grid grid-cols-1 ${currentViewMode === 'dual' ? 'lg:grid-cols-2' : ''} gap-4">
                            
                            <!-- 軌道 1：白話大腦模型 -->
                            ${currentViewMode !== 'proof' ? `
                                <div class="bg-cyan-950/20 border border-cyan-800/40 rounded-xl p-4 flex flex-col gap-2">
                                    <div class="flex items-center gap-1.5 text-cyan-400 text-xs font-bold uppercase tracking-wider">
                                        <span>【白話大腦模型・直覺剖析】</span>
                                    </div>
                                    <p class="text-xs sm:text-sm text-cyan-100/90 leading-relaxed whitespace-pre-line">
                                        ${escapeHTML(item.intuition)}
                                    </p>
                                </div>
                            ` : ''}

                            <!-- 軌道 2：嚴謹數學證明與形式推導 -->
                            ${currentViewMode !== 'intuition' ? `
                                <div class="bg-indigo-950/20 border border-indigo-800/40 rounded-xl p-4 flex flex-col gap-2">
                                    <div class="flex items-center gap-1.5 text-indigo-400 text-xs font-bold uppercase tracking-wider">
                                        <span>【嚴謹數學證明・形式推導】</span>
                                    </div>
                                    <div class="text-xs sm:text-sm text-indigo-100/90 leading-relaxed whitespace-pre-line font-mono latex-rendered">
                                        ${item.proof}
                                    </div>
                                </div>
                            ` : ''}

                        </div>

                        <!-- 考場避坑指引 -->
                        <div class="bg-amber-950/20 border border-amber-800/40 rounded-xl p-3 flex items-start gap-2.5">
                            <span class="text-amber-400 text-xs font-bold shrink-0 mt-0.5">【考場避坑】</span>
                            <div class="text-xs text-amber-200/90 leading-relaxed">
                                ${escapeHTML(item.pitfall)}
                            </div>
                        </div>

                    </div>

                    <!-- 測驗遮罩按鈕 (僅在測驗模式下顯示) -->
                    ${isExamMask ? `
                        <button onclick="revealExamAnswer('${item.id}')" id="btn-reveal-${item.id}" class="w-full py-2 bg-indigo-600/30 hover:bg-indigo-600/50 border border-indigo-500/40 rounded-xl text-xs font-semibold text-indigo-300 transition">
                            點擊揭曉解答與證明推導
                        </button>
                    ` : ''}

                </div>
            `;
        }

        function toggleCardDetail(id) {
            const el = document.getElementById(`detail-${id}`);
            if (el) {
                el.classList.toggle('hidden');
            }
        }

        function revealExamAnswer(id) {
            const el = document.getElementById(`detail-${id}`);
            const btn = document.getElementById(`btn-reveal-${id}`);
            if (el) {
                el.classList.remove('hidden');
                if (btn) btn.classList.add('hidden');
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        function getSectionName(sec) {
            switch(sec) {
                case 'formulas': return '核心公式定理';
                case 'hw1': return '作業一詳解';
                case 'practice1': return '練習一詳解';
                case 'variations': return '變化題型演練';
                default: return '全部內容';
            }
        }

        function getCategoryName(cat) {
            switch(cat) {
                case 'ch1-2': return 'Ch. 1-2 完善保密';
                case 'ch4-5': return 'Ch. 4-5 計算安全與 PRG';
                case 'ch6-7': return 'Ch. 6-7 PRF 與 Feistel';
                case 'ch8-9': return 'Ch. 8 選擇明文安全 CPA';
                default: return '全部章節';
            }
        }
    </script>

    <script id="header-sync-script">
    function syncHeaderHeight() {
        const header = document.getElementById('site-header') || document.querySelector('header');
        if (header) {
            const h = Math.ceil(header.getBoundingClientRect().height);
            document.documentElement.style.setProperty('--header-height', `${h}px`);
        }
    }
    window.addEventListener('resize', syncHeaderHeight);
    window.addEventListener('orientationchange', syncHeaderHeight);
    document.addEventListener('DOMContentLoaded', syncHeaderHeight);
    setTimeout(syncHeaderHeight, 50);
    setTimeout(syncHeaderHeight, 200);
    setTimeout(syncHeaderHeight, 600);
    </script>

</body>
</html>
